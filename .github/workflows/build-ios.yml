name: Build music for iPhone

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-build]
    paths:
      - '.github/workflows/build-ios.yml'
      - 'ios/project.yml'
      - 'ios/Sources/**'
      - 'ios/Resources/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone
        run: |
          curl -fsSL --retry 2 --max-time 60 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.47.0/xcodegen.zip \
            -o "$RUNNER_TEMP/xcodegen.zip"
          echo "6ef12a3ef5327c2c713397f46d9160550f8b1cdc5c925cd884d65c77c9f696cd  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec project.yml
          xcodebuild -project Music.xcodeproj -scheme Music -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned app
        run: |
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/Music.app Payload/Music.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Music.app/Info.plist
          lipo Payload/Music.app/Music -verify_arch arm64
          zip -qry music-ios-unsigned.ipa Payload
          unzip -tq music-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: music-ios-unsigned
          path: ios/music-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
